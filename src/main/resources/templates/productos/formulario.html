<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Producto</title>

    <link rel="stylesheet"  th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <header>
        <h1>Distribuidora de Hostelería</h1>
        <p>Alta de Producto</p>
    </header>

    <div class="form-container">

        <h2 th:text="${titulo}"></h2>

        <div class="mensaje-error"
             th:if="${error != null}"
             th:text="${error}">
        </div>

        <form th:action="@{'/productos/crear'}" th:object="${producto}" method="post">
            <input type="hidden"
                   id="codProducto"
                   name="codProducto" th:field="*{codProducto}">

            <div class="form-group">

                <label>Nombre</label>

                <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        th:field="*{nombre}"
                        required>

            </div>

            <div class="form-group">

                <label>Categoría</label>

                <input
                        type="text"
                        id="categoria"
                        name="categoria"
                        th:field="*{categoria}"
                        required>

            </div>

            <div class="form-group">

                <label>Precio (€)</label>

                <input
                        type="number"
                        step="0.01"
                        id="precio"
                        name="precio"
                        th:field="*{precio}"
                        required>

            </div>

            <div class="form-group">

                <label>Stock</label>

                <input
                        type="number"
                        id="stock"
                        name="stock"
                        th:field="*{stock}"
                        required>

            </div>

            <div class="form-group">

                <label>Descripción</label>

                <textarea
                        id="descripcion"
                        name="descripcion"
                        th:field="*{descripcion}"
                        rows="5"></textarea>

            </div>

            <div class="buttons">

                <button type="submit" class="btn btn-primary" th:href="@{'/productos/crear'}">
                    Guardar Producto
                </button>

                <a th:href="@{'/productos'}" class="btn btn-secondary">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
